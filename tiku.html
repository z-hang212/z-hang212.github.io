<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>信创适配迁移赛 · 完全独立300题库 | 无循环无重复 | 即时反馈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #eef2f7 0%, #dce5ef 100%);
            font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 30px 20px;
            color: #1a2c3e;
        }
        .exam-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fffffffa;
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .exam-header {
            background: linear-gradient(135deg, #0f2e3f 0%, #1b4a6e 100%);
            padding: 20px 30px;
            color: white;
            border-bottom: 3px solid #ffb347;
        }
        .exam-header h1 { font-size: 1.8rem; font-weight: 600; display: flex; gap: 12px; flex-wrap: wrap; }
        .stats-bar {
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px;
            margin-top: 15px; background: #ffffff20; padding: 12px 20px; border-radius: 60px;
        }
        .stat { background: #00000030; padding: 6px 16px; border-radius: 40px; font-weight: 500; }
        .stat span { font-weight: 700; color: #ffd966; font-size: 1.2rem; margin-right: 6px; }
        .quiz-main { display: flex; flex-wrap: wrap; }
        .question-panel { flex: 3; min-width: 280px; padding: 28px 32px; background: #fefefe; }
        .sidebar { flex: 1.2; min-width: 220px; background: #f4f8fe; border-left: 1px solid #cfdfed; padding: 28px 18px; display: flex; flex-direction: column; gap: 24px; }
        .q-card { background: white; border-radius: 32px; padding: 20px 28px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.02), 0 0 0 1px #e2edf7; }
        .q-title { font-size: 1rem; font-weight: 600; margin-bottom: 18px; background: #eef4fa; display: inline-block; padding: 4px 18px; border-radius: 40px; color: #1f6392; }
        .q-text { font-size: 1.05rem; font-weight: 500; margin-bottom: 20px; padding-left: 10px; border-left: 5px solid #ffb347; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .option { display: flex; align-items: flex-start; gap: 12px; background: #f9fbfe; padding: 10px 16px; border-radius: 20px; cursor: pointer; border: 1px solid #e2edf7; }
        .option:hover { background: #eef3fc; }
        .option input { margin-top: 3px; width: 18px; height: 18px; cursor: pointer; accent-color: #1f6392; }
        .option label { flex: 1; font-size: 0.95rem; cursor: pointer; }
        .option.correct-highlight { background-color: #d4edda; border-color: #28a745; }
        .option.wrong-highlight { background-color: #f8d7da; border-color: #dc3545; text-decoration: line-through; }
        .option.correct-answer-display { background-color: #d1e7dd; border-color: #0f6b2f; font-weight: 500; }
        .feedback-area { margin-top: 18px; padding: 16px 18px; background: #f0f5fb; border-radius: 24px; border-left: 6px solid #ffb347; font-size: 0.9rem; }
        .feedback-correct { color: #155724; font-weight: 600; }
        .feedback-wrong { color: #721c24; font-weight: 600; }
        .feedback-neutral { color: #004085; }
        .action-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 15px; flex-wrap: wrap; }
        button { background: #2c5a7a; border: none; padding: 10px 22px; border-radius: 50px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; }
        button:hover { background: #1f4b68; transform: translateY(-2px); }
        .btn-primary { background: #ff8c42; }
        .btn-confirm { background: #28a745; }
        .reset-btn { background: #5f7f9e; }
        .question-nav { background: white; border-radius: 28px; padding: 12px; }
        .nav-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; max-height: 420px; overflow-y: auto; padding: 5px; }
        .nav-btn { background: #eef2f7; border-radius: 16px; text-align: center; padding: 8px 0; font-size: 0.7rem; font-weight: bold; cursor: pointer; border: 1px solid #d4e0ea; }
        .nav-btn.answered { background: #ffb347; color: #2c2c2c; }
        .nav-btn.current { background: #1f6392; color: white; box-shadow: 0 0 0 2px white, 0 0 0 4px #1f6392; }
        .result-area { background: white; border-radius: 28px; padding: 18px; text-align: center; }
        .score-text { font-size: 2rem; font-weight: 800; color: #ff8c42; }
        @media (max-width: 760px) { .question-panel { padding: 20px; } .q-card { padding: 15px; } .nav-grid { grid-template-columns: repeat(5, 1fr); } }
        footer { text-align: center; padding: 16px; font-size: 0.75rem; color: #5b7a9a; background: #eaf1f9; }
    </style>
</head>
<body>
<div class="exam-container">
    <div class="exam-header">
        <h1>📚 教育信创大赛 · 适配迁移赛 <small>300题完全独立 | 单选+多选+判断</small></h1>
        <div class="stats-bar">
            <div class="stat">📋 总题数: <span id="totalCount">300</span></div>
            <div class="stat">✅ 已答: <span id="answeredCount">0</span></div>
            <div class="stat">⏱️ 用时: <span id="timer">00:00:00</span></div>
            <div class="stat">⭐ 当前得分: <span id="realScore">0</span> / <span id="maxScoreSpan">300</span></div>
        </div>
    </div>
    <div class="quiz-main">
        <div class="question-panel">
            <div id="currentQWrapper"></div>
            <div class="action-buttons">
                <div><button id="prevBtn" class="reset-btn">◀ 上一题</button><button id="nextBtn" class="reset-btn">下一题 ▶</button></div>
                <div><button id="confirmMultiBtn" class="btn-confirm" style="display: none;">✅ 确认答案</button><button id="submitBtn" class="btn-primary">✨ 提交总成绩</button></div>
            </div>
        </div>
        <div class="sidebar">
            <div class="question-nav"><div style="font-weight: bold; margin-bottom: 8px;">📌 题目导航</div><div class="nav-grid" id="navGrid"></div></div>
            <div class="result-area"><div>🏆 最终成绩</div><div class="score-text" id="finalScoreDisplay">—</div><div id="scoreDetail" style="font-size:0.8rem; margin-top:6px;"></div><button id="resetAllBtn" style="background:#3c6e47; margin-top: 14px; width:100%">🔄 重置全部答题</button></div>
        </div>
    </div>
    <footer>⭐ 单选题/判断题点击选项即判；多选题勾选后点击「确认答案」判题。300题全部独立原创，零循环零重复，覆盖信创全栈知识点。</footer>
</div>

<script>

    const questions = [];

    function addSingle(id, text, options, correct, explanation, detailedAnalysis) {
    questions.push({ 
        id, text, options, correct, explanation, 
        detailedAnalysis: detailedAnalysis || null,  // 新增字段
        type: "single", 
        userAnswer: null, 
        answered: false 
    });
}
    function addMulti(id, text, options, correctArr, explanation) {
        questions.push({ id, text, options, correct: correctArr, explanation, type: "multi", userAnswer: null, answered: false });
    }
    function addJudge(id, text, correctBool, explanation) {
        let options = ["A. 正确", "B. 错误"];
        let correct = correctBool ? "A" : "B";
        questions.push({ id, text, options, correct, explanation, type: "judge", userAnswer: null, answered: false });
    }


// ===================== 第1-100题（带详细解析版） =====================
// 每题均包含简短解析(explanation)和详细选项解析(detailedAnalysis)
// chapter参数从1开始编号

// ===================== 第1-50题 =====================

addSingle(1, "龙芯处理器目前主要采用的自主指令集架构是？", 
    ["A. x86", "B. ARM", "C. LoongArch", "D. RISC‑V"], 
    "C", 
    "龙芯早期采用MIPS架构，目前3A5000/3A6000均采用LoongArch自主指令集。",
    "🔍 【选项逐项精析】<br><strong>A ❌ x86</strong>：x86是Intel/AMD的复杂指令集架构，国产兆芯、海光采用此架构，龙芯不采用。<br><br><strong>B ❌ ARM</strong>：ARM是英国ARM公司的RISC架构，飞腾、鲲鹏采用，龙芯不采用。<br><br><strong>C ✅ LoongArch</strong>：龙芯中科于2020年发布的完全自主指令集架构，龙芯3A5000/3A6000均采用。<br><br><strong>D ❌ RISC‑V</strong>：RISC-V是加州伯克利分校发起的开源RISC架构，龙芯未采用。"
);

// 第2题
addSingle(2, "飞腾FT‑2000/2500系列CPU采用的架构是？", 
    ["A. x86", "B. ARMv8", "C. MIPS", "D. PowerPC"], 
    "B", 
    "飞腾处理器基于ARMv8架构授权研发。",
    "🔍 【选项逐项精析】<br><strong>A ❌ x86</strong>：x86是复杂指令集，海光/兆芯采用，飞腾不采用。<br><br><strong>B ✅ ARMv8</strong>：飞腾获得ARMv8架构永久授权，FT-2000/2500系列均基于此架构。<br><br><strong>C ❌ MIPS</strong>：MIPS是斯坦福大学开发的RISC架构，龙芯早期使用，飞腾不采用。<br><br><strong>D ❌ PowerPC</strong>：PowerPC是IBM开发的RISC架构，申威早期基于此发展，飞腾不采用。"
);

// 第3题
addSingle(3, "以下哪一款CPU属于国产ARM架构？", 
    ["A. 龙芯3A5000", "B. 飞腾S2500", "C. 兆芯KX‑6000", "D. 申威SW‑26010"], 
    "B", 
    "飞腾S2500基于ARMv8架构，属于国产ARM服务器CPU。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 龙芯3A5000</strong>：龙芯3A5000采用自主LoongArch指令集，不属于ARM架构。<br><br><strong>B ✅ 飞腾S2500</strong>：飞腾S2500基于ARMv8架构，是国产ARM服务器CPU的代表。<br><br><strong>C ❌ 兆芯KX‑6000</strong>：兆芯KX-6000采用x86架构（通过威盛授权），不属于ARM。<br><br><strong>D ❌ 申威SW‑26010</strong>：申威SW-26010采用自主SW64指令集，用于神威·太湖之光超算。"
);

// 第4题
addSingle(4, "从x86平台迁移到飞腾ARM平台时，最核心的问题是？", 
    ["A. 内存不足", "B. 二进制不兼容需重新编译", "C. 硬盘空间不足", "D. 显卡不支持"], 
    "B", 
    "x86与ARM指令集不同，二进制文件不兼容，需重新编译源码。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 内存不足</strong>：内存不足是硬件配置问题，与架构迁移核心问题无关。<br><br><strong>B ✅ 二进制不兼容需重新编译</strong>：x86与ARM指令集完全不同，已编译的二进制程序无法在ARM上直接运行，需获取源码重新编译。<br><br><strong>C ❌ 硬盘空间不足</strong>：硬盘空间是存储问题，与架构迁移无关。<br><br><strong>D ❌ 显卡不支持</strong>：显卡驱动问题可能遇到，但不是架构迁移最核心的问题。"
);

// 第5题
addSingle(5, "LoongArch指令集由哪家公司主导研发？", 
    ["A. 华为", "B. 龙芯", "C. 飞腾", "D. 海光"], 
    "B", 
    "LoongArch由龙芯中科技术股份有限公司主导研发。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 华为</strong>：华为研发鲲鹏芯片（ARM架构），与LoongArch无关。<br><br><strong>B ✅ 龙芯</strong>：龙芯中科于2020年发布完全自主的LoongArch指令集。<br><br><strong>C ❌ 飞腾</strong>：飞腾基于ARMv8架构，不研发LoongArch。<br><br><strong>D ❌ 海光</strong>：海光基于x86架构（AMD Zen授权），与LoongArch无关。"
);

// 第6题
addSingle(6, "飞腾CPU主要面向的应用场景不包括？", 
    ["A. 服务器", "B. 桌面终端", "C. 嵌入式", "D. 高性能GPU渲染"], 
    "D", 
    "飞腾CPU主要用于服务器、桌面和嵌入式场景，GPU渲染非其主要定位。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 服务器</strong>：飞腾S2500是64核服务器CPU，服务器是主要场景。<br><br><strong>B ❌ 桌面终端</strong>：飞腾FT-2000/4、D2000是桌面CPU，桌面是主要场景。<br><br><strong>C ❌ 嵌入式</strong>：飞腾有嵌入式产品线（如FT-1500C），嵌入式是场景之一。<br><br><strong>D ✅ 高性能GPU渲染</strong>：飞腾CPU不具备GPU渲染能力，这是独立显卡或GPU芯片的功能。"
);

// 第7题
addSingle(7, "龙芯3A6000主要定位于？", 
    ["A. 高性能服务器", "B. 桌面办公终端", "C. 存储阵列控制器", "D. 智能网卡"], 
    "B", 
    "龙芯3A6000是桌面级处理器，面向办公和家用终端。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 高性能服务器</strong>：服务器产品为龙芯3C系列（如3C5000），3A系列为桌面。<br><br><strong>B ✅ 桌面办公终端</strong>：龙芯3A6000是桌面处理器，主频2.5GHz，面向办公和家用。<br><br><strong>C ❌ 存储阵列控制器</strong>：存储控制器属于嵌入式或专用芯片领域。<br><br><strong>D ❌ 智能网卡</strong>：智能网卡使用专用网络处理器或FPGA。"
);

// 第8题
addSingle(8, "ARM架构相比x86的主要特点是？", 
    ["A. 指令复杂、功耗高", "B. 指令精简、功耗低", "C. 仅支持Windows", "D. 不支持虚拟化"], 
    "B", 
    "ARM是RISC精简指令集架构，以低功耗、高能效比著称。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 指令复杂、功耗高</strong>：这是x86（CISC）的特点，ARM正好相反。<br><br><strong>B ✅ 指令精简、功耗低</strong>：ARM是RISC架构，指令集精简，功耗低，能效比高。<br><br><strong>C ❌ 仅支持Windows</strong>：ARM支持Linux、Android、iOS、Windows等多种操作系统。<br><br><strong>D ❌ 不支持虚拟化</strong>：ARMv8架构支持硬件虚拟化扩展（Virtualization Extensions）。"
);

// 第9题
addSingle(9, "在信创项目中，飞腾CPU通常搭配的操作系统是？", 
    ["A. Windows 10", "B. 银河麒麟", "C. Android", "D. FreeBSD"], 
    "B", 
    "银河麒麟是飞腾CPU在信创项目中的主流操作系统搭配。",
    "🔍 【选项逐项精析】<br><strong>A ❌ Windows 10</strong>：Windows 10 ARM版虽可运行，但信创项目要求国产操作系统。<br><br><strong>B ✅ 银河麒麟</strong>：银河麒麟是信创项目的主流国产操作系统，与飞腾深度适配。<br><br><strong>C ❌ Android</strong>：Android主要用于移动端，不是信创桌面/服务器的主流OS。<br><br><strong>D ❌ FreeBSD</strong>：FreeBSD是国外开源系统，不符合信创要求。"
);

// 第10题
addSingle(10, "龙芯早期采用的MIPS架构属于？", 
    ["A. 复杂指令集（CISC）", "B. 精简指令集（RISC）", "C. 显式并行指令集", "D. 向量指令集"], 
    "B", 
    "MIPS是典型的RISC（精简指令集）架构。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 复杂指令集（CISC）</strong>：CISC代表是x86，MIPS属于RISC。<br><br><strong>B ✅ 精简指令集（RISC）</strong>：MIPS（Microprocessor without Interlocked Pipeline Stages）是经典RISC架构。<br><br><strong>C ❌ 显式并行指令集</strong>：EPIC是Intel安腾（Itanium）采用的架构。<br><br><strong>D ❌ 向量指令集</strong>：向量指令集是SIMD扩展，如x86的SSE/AVX。"
);

// 第11题
addSingle(11, "飞腾CPU支持的字节序是？", 
    ["A. 大端", "B. 小端", "C. 可切换", "D. 不固定"], 
    "B", 
    "飞腾ARM架构默认使用小端字节序（Little-Endian）。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 大端</strong>：大端是MIPS、SPARC等架构的字节序，ARM默认小端。<br><br><strong>B ✅ 小端</strong>：ARMv8架构默认小端字节序，x86也是小端，便于兼容。<br><br><strong>C ❌ 可切换</strong>：ARM架构支持大小端切换（BE-8），但飞腾默认小端。<br><br><strong>D ❌ 不固定</strong>：ARM有固定默认字节序。"
);

// 第12题
addSingle(12, "下列哪种情况一般不需要重新编译源码？", 
    ["A. x86→ARM", "B. 同架构不同发行版", "C. ARM32→ARM64", "D. 不同指令集"], 
    "B", 
    "同架构（如均为ARM64）不同Linux发行版通常不需要重新编译。",
    "🔍 【选项逐项精析】<br><strong>A ❌ x86→ARM</strong>：架构不同，必须重新编译。<br><br><strong>B ✅ 同架构不同发行版</strong>：同为ARM64架构，麒麟和统信之间通常二进制兼容，不需要重新编译。<br><br><strong>C ❌ ARM32→ARM64</strong>：32位和64位指令集不同，需要重新编译。<br><br><strong>D ❌ 不同指令集</strong>：不同指令集（如x86与LoongArch）必须重新编译。"
);

// 第13题
addSingle(13, "LoongArch对MIPS的主要改进在于？", 
    ["A. 提高功耗", "B. 完全自主可控", "C. 减少寄存器数量", "D. 取消MMU"], 
    "B", 
    "LoongArch是完全自主设计的指令集，摆脱了MIPS授权限制。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 提高功耗</strong>：LoongArch优化了功耗，不是提高。<br><br><strong>B ✅ 完全自主可控</strong>：LoongArch是100%自主设计的指令集，拥有完整知识产权。<br><br><strong>C ❌ 减少寄存器数量</strong>：LoongArch增加了寄存器数量（32个通用寄存器）。<br><br><strong>D ❌ 取消MMU</strong>：LoongArch保留并优化了MMU（内存管理单元）。"
);

// 第14题
addSingle(14, "飞腾服务器CPU常见的核数范围是？", 
    ["A. 4核", "B. 8–64核", "C. 128核以上", "D. 单核"], 
    "B", 
    "飞腾服务器CPU从8核到64核不等，如S2500为64核。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 4核</strong>：4核是桌面CPU的规格（如FT-2000/4）。<br><br><strong>B ✅ 8–64核</strong>：飞腾服务器CPU覆盖8核至64核，FT-1500A/16为16核，S2500为64核。<br><br><strong>C ❌ 128核以上</strong>：目前飞腾最高64核，128核尚未推出。<br><br><strong>D ❌ 单核</strong>：单核是嵌入式或极低端芯片的规格。"
);

// 第15题
addSingle(15, "关于国产CPU生态，以下说法正确的是？", 
    ["A. 只支持Linux", "B. 部分支持Windows", "C. 全部兼容x86软件无需修改", "D. 无法运行Java程序"], 
    "B",

addSingle(411, "在龙芯LoongArch平台编译C++项目时，若需启用LASX向量扩展并指定3A6000微架构优化，正确的GCC参数组合是（ ）", 
    ["A. -march=la464 -mlasx", "B. -march=loongarch64 -msse4.2", "C. -march=la664 -mlasx", "D. -march=native -mavx2"], 
    "C", 
    "龙芯3A6000采用LA664微架构，启用LASX向量扩展需使用-mlasx。",
    "🔍 【选项逐项精析】<br><strong>A ❌ -march=la464 -mlasx</strong>：la464是3A5000的微架构，3A6000应使用la664。<br><br><strong>B ❌ -march=loongarch64 -msse4.2</strong>：msse4.2是x86指令集，龙芯不支持。<br><br><strong>C ✅ -march=la664 -mlasx</strong>：la664是3A6000微架构，-mlasx启用LASX向量扩展。<br><br><strong>D ❌ -march=native -mavx2</strong>：mavx2是x86指令集，龙芯不支持。"
);

// 第902题
addSingle(412, "飞腾ARM平台运行Java应用时，发现SHA-256哈希计算性能瓶颈，首要优化方向是（ ）", 
    ["A. 增加JVM堆内存", "B. 确认JDK已启用ARMv8 SHA扩展指令", "C. 更换为MD5算法", "D. 使用多线程并行计算"], 
    "B", 
    "ARMv8提供SHA硬件加速指令，JDK需启用才能利用硬件加速。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 增加JVM堆内存</strong>：堆内存与SHA计算性能无关。<br><br><strong>B ✅ 确认JDK已启用ARMv8 SHA扩展指令</strong>：SHA硬件加速可大幅提升性能。<br><br><strong>C ❌ 更换为MD5算法</strong>：MD5安全性低于SHA-256，不推荐。<br><br><strong>D ❌ 使用多线程并行计算</strong>：并行计算增加开销，不能解决单线程瓶颈。"
);

// 第903题
addSingle(413, "将x86平台的AVX2图像处理代码迁移至龙芯LoongArch时，应使用的SIMD指令集及编译选项是（ ）", 
    ["A. NEON / -mneon", "B. LSX / -mlsx", "C. LASX / -mlasx", "D. SSE4.2 / -msse4.2"], 
    "C", 
    "LASX（256位）是龙芯对标x86 AVX2的SIMD指令集，使用-mlasx启用。",
    "🔍 【选项逐项精析】<br><strong>A ❌ NEON / -mneon</strong>：NEON是ARM的SIMD指令集，龙芯不使用。<br><br><strong>B ❌ LSX / -mlsx</strong>：LSX是128位SIMD，对应x86的SSE，性能低于AVX2。<br><br><strong>C ✅ LASX / -mlasx</strong>：LASX是256位SIMD，对应x86 AVX2。<br><br><strong>D ❌ SSE4.2 / -msse4.2</strong>：SSE4.2是x86指令集，龙芯不支持。"
);

// 第904题
addSingle(414, "在飞腾平台编译Nginx时，为充分利用ARMv8 CRC32硬件加速提升日志处理性能，configure阶段需添加（ ）", 
    ["A. --with-crc32-hw", "B. --enable-armv8-crc", "C. --with-cc-opt='-march=armv8-a+crc'", "D. --with-cpu-opt=arm64"], 
    "C", 
    "Nginx通过--with-cc-opt传递编译选项，-march=armv8-a+crc启用CRC32硬件加速。",
    "🔍 【选项逐项精析】<br><strong>A ❌ --with-crc32-hw</strong>：这不是Nginx的标准configure选项。<br><br><strong>B ❌ --enable-armv8-crc</strong>：这不是Nginx的标准configure选项。<br><br><strong>C ✅ --with-cc-opt='-march=armv8-a+crc'</strong>：通过编译选项启用CRC32硬件加速。<br><br><strong>D ❌ --with-cpu-opt=arm64</strong>：--with-cpu-opt不是Nginx的标准选项。"
);

// 第905题
addSingle(415, "龙芯平台使用LATX翻译运行x86教育软件时，若程序依赖x86特有的CPUID指令获取厂商信息，LATX会（ ）", 
    ["A. 返回真实LoongArch CPUID", "B. 模拟返回预设的x86 CPUID字符串", "C. 触发非法指令异常", "D. 返回空字符串"], 
    "B", 
    "LATX会模拟返回预设的x86 CPUID字符串，保证软件兼容运行。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 返回真实LoongArch CPUID</strong>：返回真实CPUID会导致软件识别错误。<br><br><strong>B ✅ 模拟返回预设的x86 CPUID字符串</strong>：LATX模拟x86 CPUID以保证兼容性。<br><br><strong>C ❌ 触发非法指令异常</strong>：LATX会处理CPUID指令，不会触发异常。<br><br><strong>D ❌ 返回空字符串</strong>：返回空会导致软件无法正常识别。"

// 第906题
addSingle(416, "飞腾S5000C服务器部署分布式数据库时，发现跨NUMA节点内存访问延迟高，应通过以下哪种方式优化进程绑定（ ）", 
    ["A. taskset -c 0-31", "B. numactl --cpunodebind=0 --membind=0", "C. nice -n -20", "D. ionice -c 1"], 
    "B", 
    "numactl可精确控制进程绑定到特定NUMA节点及其内存分配策略。",
    "🔍 【选项逐项精析】<br><strong>A ❌ taskset -c 0-31</strong>：taskset只绑定CPU核心，不控制内存节点。<br><br><strong>B ✅ numactl --cpunodebind=0 --membind=0</strong>：同时绑定CPU和内存到NUMA节点0。<br><br><strong>C ❌ nice -n -20</strong>：nice调整进程优先级，不影响NUMA。<br><br><strong>D ❌ ionice -c 1</strong>：ionice调整IO优先级，不影响NUMA。"
);

// 第907题
addSingle(417, "在LoongArch平台调试多线程死锁问题时，GDB显示所有线程均处于futex等待状态，但无明确锁持有者，最可能是（ ）", 
    ["A. GDB版本不支持LoongArch", "B. LATX翻译导致的原子操作语义偏差", "C. 内存屏障缺失导致可见性问题", "D. 编译器优化过度"], 
    "C", 
    "LoongArch是弱内存序架构，内存屏障缺失会导致锁的可见性问题。",
    "🔍 【选项逐项精析】<br><strong>A ❌ GDB版本不支持LoongArch</strong>：GDB支持LoongArch，且已能显示线程状态。<br><br><strong>B ❌ LATX翻译导致的原子操作语义偏差</strong>：原生LoongArch程序不涉及LATX。<br><br><strong>C ✅ 内存屏障缺失导致可见性问题</strong>：弱内存序架构需要显式内存屏障保证可见性。<br><br><strong>D ❌ 编译器优化过度</strong>：过度优化可能导致指令重排，但通常不会导致无锁持有者。"
);

// 第908题
addSingle(418, "飞腾平台Kubernetes集群中，Pod内应用读取/config目录下的ConfigMap文件缓慢，首要排查（ ）", 
    ["A. ConfigMap大小是否超过1MB", "B. 存储驱动是否为overlay2且底层FS支持d_type", "C. Pod CPU limit设置过低", "D. etcd集群健康状态"], 
    "B", 
    "ConfigMap通过Volume挂载，overlay2存储驱动和d_type支持影响文件读取性能。",
    "🔍 【选项逐项精析】<br><strong>A ❌ ConfigMap大小是否超过1MB</strong>：ConfigMap默认1MB限制影响是否能挂载，非读取速度。<br><br><strong>B ✅ 存储驱动是否为overlay2且底层FS支持d_type</strong>：存储驱动直接影响文件IO性能。<br><br><strong>C ❌ Pod CPU limit设置过低</strong>：CPU限制影响计算，非文件读取。<br><br><strong>D ❌ etcd集群健康状态</strong>：etcd影响ConfigMap更新，非读取性能。"
);

// 第909题
addSingle(419, "麒麟V10系统上，应用通过dlopen加载动态库时优先搜索路径由以下哪个环境变量控制（ ）", 
    ["A. PATH", "B. LD_PRELOAD", "C. LD_LIBRARY_PATH", "D. PKG_CONFIG_PATH"],

// 第910题
addSingle(420, "统信UOS服务器版启动后SSH服务延迟30秒才可用，journalctl显示'Waiting for network to be online'，应检查（ ）", 
    ["A. systemd-networkd-wait-online.service超时配置", "B. SSH密钥生成耗时", "C. DNS解析超时", "D. 防火墙规则加载"],

// 第911题

    ["A. runner.activebackup.hwaddr_policy", "B. link_watch.interval", "C. port.priority", "D. mcast_rejoin.count"],

// 第912题
addSingle(422, "统信UOS上使用apt安装软件包时提示'Hash Sum mismatch'，但源文件校验正常，最可能原因是（ ）", 
    ["A. 网络传输中断", "B. 本地缓存损坏，需执行apt clean", "C. GPG密钥过期", "D. 磁盘空间不足"],

// 第913题
addSingle(423, "麒麟系统审计规则中，监控/etc/passwd文件修改的正确auditctl命令是（ ）", 
    ["A. auditctl -w /etc/passwd -p wa -k passwd_changes", "B. auditctl -a always,exit -F path=/etc/passwd -S open", "C. auditctl -w /etc/shadow -p r -k shadow_read", "D. auditctl -a always,entry -F dir=/etc"], 
    "A", 
    "auditctl -w监控文件，-p wa监控写和属性变更，-k添加关键字标识。",
    "🔍 【选项逐项精析】<br><strong>A ✅ auditctl -w /etc/passwd -p wa -k passwd_changes</strong>：正确监控文件写操作和属性变更。<br><br><strong>B ❌ -a always,exit -F path=/etc/passwd -S open</strong>：语法错误，path应使用-w。<br><br><strong>C ❌ auditctl -w /etc/shadow -p r -k shadow_read</strong>：监控shadow文件读操作，非passwd。<br><br><strong>D ❌ auditctl -a always,entry -F dir=/etc</strong>：监控整个/etc目录，范围过大。"
);

// 第914题
addSingle(424, "统信UOS上systemd服务配置了RestartSec=5s但重启间隔实际为30秒，可能是因为（ ）", 
    ["A. StartLimitIntervalSec触发了速率限制", "B. 服务类型为notify但未发送READY=1", "C. ExecStartPre失败", "D. 系统负载过高"], 
    "A", 
    "StartLimitIntervalSec限制服务重启频率，触发后会延长重启间隔。",
    "🔍 【选项逐项精析】<br><strong>A ✅ StartLimitIntervalSec触发了速率限制</strong>：频繁重启触发限制，延长重启间隔。<br><br><strong>B ❌ 服务类型为notify但未发送READY=1</strong>：导致服务被认为未就绪，但不会改变重启间隔。<br><br><strong>C ❌ ExecStartPre失败</strong>：失败会导致服务不启动，而非重启间隔变化。<br><br><strong>D ❌ 系统负载过高</strong>：负载高可能导致调度延迟，但不会精确到30秒。"
);

// 第915题
addSingle(425, "海量数据库InfiniDB执行带OR条件的查询时未走索引，优化器选择全表扫描，最有效的改写方式是（ ）", 
    ["A. 增加HINT强制索引", "B. 将OR拆分为UNION ALL子查询", "C. 创建函数索引", "D. 增加parallel hint"], 
    "B", 
    "OR条件拆分UNION ALL可让每个分支独立使用索引。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 增加HINT强制索引</strong>：OR条件强制索引可能无效。<br><br><strong>B ✅ 将OR拆分为UNION ALL子查询</strong>：每个分支独立使用索引。<br><br><strong>C ❌ 创建函数索引</strong>：函数索引适用于特定场景，不解决OR问题。<br><br><strong>D ❌ 增加parallel hint</strong>：并行不改变执行计划选择。"
);

// 第916题
addSingle(426, "从PostgreSQL迁移至海量数据库时，ARRAY类型字段应映射为（ ）", 
    ["A. VARCHAR", "B. JSON/JSONB", "C. TEXT", "D. 不支持数组类型"], 
    "B", 
    "海量数据库基于PostgreSQL，支持JSON/JSONB类型作为ARRAY的替代方案。",

);

// 第917题
addSingle(427, "海量数据库中频繁UPDATE分区表的分区键字段导致性能下降，根本原因是（ ）", 
    ["A. 分区裁剪失效", "B. 行迁移（Row Movement）开销大", "C. 索引重建", "D. 统计信息不准"], 
    "B", 
    "更新分区键会导致行从一个分区迁移到另一个分区，产生大量开销。",
    "🔍 【选项逐项精析】<br><strong>A ❌ 分区裁剪失效</strong>：分区裁剪失效导致全表扫描，但不会因更新分区键导致。<br><br><strong>B ✅ 行迁移（Row Movement）开销大</strong>：更新分区键触发行迁移，开销巨大。<br><br><strong>C ❌ 索引重建</strong>：索引更新是影响之一，但根本原因是行迁移。<br><br><strong>D ❌ 统计信息不准</strong>：统计信息不准影响执行计划，非根本原因。"
);

addSingle(428, "海量数据库逻辑导出时，为避免长事务阻塞业务，应使用（ ）", 
    ["A. expdp full=y", "B. mysqldump --single-transaction", "C. db_export with consistent snapshot", "D. 停机导出"],

    "海量数据库的db_export工具支持consistent snapshot一致性快照导出。",
    "🔍 【选项逐项精析】<br><strong>A ❌ expdp full=y</strong>：expdp是Oracle工具，海量不使用。<br><br><strong>B ❌ mysqldump --single-transaction</strong>：mysqldump是MySQL工具。<br><br><strong>C ✅ db_export with consistent snapshot</strong>：海量数据库的导出工具支持一致性快照。<br><br><strong>D ❌ 停机导出</strong>：停机导出会影响业务。"
);

    ["A. MANIFEST.MF中的Dependencies属性", "B. inforsuite-deployment.xml专有配置", "C. web.xml context-param", "D. application.properties"],

addMulti(735, "海量数据库索引优化原则包括（ ）",

    ["A", "B", "C", "D"], 
    "高选择性列优先、覆盖查询字段避免回表、避免过多索引拖慢写入、定期REBUILD碎片化索引都是优化原则，对所有WHERE列建索引会导致写入性能严重下降。",
    "🔍 【选项逐项精析】<br><strong>A ✅ 高选择性列优先建索引</strong>：选择性高的列（值分布均匀）建索引效果更好，能有效过滤数据。<br><br><strong>B ✅ 覆盖查询所需字段避免回表</strong>：建立覆盖索引，使查询直接从索引获取数据，避免回表查询。<br><br><strong>C ✅ 避免过多索引拖慢写入</strong>：每个索引都会增加INSERT/UPDATE/DELETE的开销，应平衡读写性能。<br><br><strong>D ✅ 定期REBUILD碎片化索引</strong>：定期重建索引减少碎片，提升查询效率。<br><br><strong>E ❌ 对所有WHERE条件列建索引</strong>：对所有WHERE列建索引会导致索引数量过多，严重影响写入性能。"
);

// 第970题
addJudge(1000, "麒麟系统firewalld默认区域public未显式允许的服务端口，入站流量将被DROP。", true, 
    "public区域默认拒绝入站流量。",
    "🔍 【选项逐项精析】<br><strong>A ✅ 正确</strong>：麒麟系统firewalld默认区域为public，未明确允许的服务端口和入站流量将被DROP（丢弃），确保系统安全。<br><br><strong>B ❌ 错误</strong>：public区域默认确实拒绝入站流量。"
);
    let currentIndex = 0, startTime = Date.now(), timerInterval = null, submitted = false;
    const totalSpan = document.getElementById("totalCount"), answeredSpan = document.getElementById("answeredCount"), timerSpan = document.getElementById("timer");
    const realScoreSpan = document.getElementById("realScore"), maxScoreSpan = document.getElementById("maxScoreSpan"), finalScoreDisplay = document.getElementById("finalScoreDisplay");
    const scoreDetailDiv = document.getElementById("scoreDetail"), navGridDiv = document.getElementById("navGrid"), currentQWrapper = document.getElementById("currentQWrapper"), confirmMultiBtn = document.getElementById("confirmMultiBtn");
    totalSpan.innerText = questions.length; maxScoreSpan.innerText = questions.length;

    function computeScore() { let s=0; for(let q of questions) { if(!q.answered) continue; if(q.type==="single"||q.type==="judge") { if(q.userAnswer===q.correct) s++; } else if(Array.isArray(q.userAnswer)&&Array.isArray(q.correct)&&q.userAnswer.length===q.correct.length&&q.correct.every(c=>q.userAnswer.includes(c))) s++; } return s; }
    function updateStatsUI() { let ac=questions.filter(q=>q.answered).length; answeredSpan.innerText=ac; let sc=computeScore(); realScoreSpan.innerText=sc; if(submitted) finalScoreDisplay.innerText=sc+" / "+questions.length; renderNav(); }
    function confirmMultiAnswer() { let q=questions[currentIndex]; if(!q||q.type!=="multi"||q.answered) return; let checked=Array.from(document.querySelectorAll('#optionsContainer input:checked')).map(cb=>cb.value); if(checked.length===0){alert("请至少选择一个选项");return;} q.userAnswer=checked; q.answered=true; updateStatsUI(); renderCurrentQuestion(); }
    function renderCurrentQuestion() { 
    let q = questions[currentIndex]; 
    if(!q) return; 
    let selected = q.userAnswer, isMulti = q.type === "multi"; 
    let html = `<div class="q-card"><div class="q-title">题目 ${currentIndex+1}/${questions.length}  <span>${q.type === 'single' ? '🔘单选' : (q.type === 'multi' ? '☑️多选' : '🔍判断')}</span></div><div class="q-text">${escapeHtml(q.text)}</div><div class="options" id="optionsContainer">`;
    
    for(let opt of q.options) {
        let letter = opt.charAt(0), optText = opt.substring(2);
        let isCorrect = (q.type !== "multi") ? (letter === q.correct) : q.correct.includes(letter);
        let isUser = (q.type !== "multi") ? (selected === letter) : (Array.isArray(selected) && selected.includes(letter));
        let addClass = "", disabled = "", checked = "";
        if(q.answered) {
            disabled = "disabled";
            if(isCorrect) addClass = "correct-answer-display";
            if(isUser && !isCorrect) addClass = "wrong-highlight";
            if(isUser && isCorrect) addClass = "correct-highlight";
            checked = isUser ? "checked" : "";
        } else {
            checked = isUser ? "checked" : "";
        }
        html += `<div class="option ${addClass}"><input type="${isMulti ? 'checkbox' : 'radio'}" name="question" value="${letter}" id="opt_${letter}" ${checked} ${disabled}><label for="opt_${letter}"><strong>${letter}</strong>. ${escapeHtml(optText)}</label></div>`;
    }
    html += `</div>`;
    
    if(q.answered) {
        let isCurrCorrect = (q.type !== "multi") ? (q.userAnswer === q.correct) : (Array.isArray(q.userAnswer) && Array.isArray(q.correct) && q.userAnswer.length === q.correct.length && q.correct.every(c => q.userAnswer.includes(c)));
        let statusText = isCurrCorrect ? "✓正确" : "✗错误";
        let statusClass = isCurrCorrect ? "feedback-correct" : "feedback-wrong";
        let correctStr = (q.type === "multi") ? q.correct.join("、") : q.correct;
        
        // 显示简短解析 + 详细解析
        let detailHtml = '';
        if(q.detailedAnalysis) {
            detailHtml = `<div class="detailed-explanation" style="margin-top:12px;padding-top:12px;border-top:2px solid #ffb347;font-size:0.85rem;">${q.detailedAnalysis}</div>`;
        }
        html += `<div class="feedback-area"><div class="${statusClass}">${statusText}</div><div><strong>📖答案：</strong> ${escapeHtml(correctStr)}</div><div><strong>💡解析：</strong> ${escapeHtml(q.explanation)}</div>${detailHtml}</div>`;
    } else {
        html += `<div class="feedback-area feedback-neutral">${isMulti ? "✅ 勾选所有正确选项后点击「确认答案」" : "⚡ 点击选项立即判题"}</div>`;
    }
    html += `</div>`;
    currentQWrapper.innerHTML = html;
    
    if(q.type !== "multi" && !q.answered) {
        document.querySelectorAll('input[name="question"]').forEach(radio => radio.addEventListener('change', (e) => {
            if(e.target.checked) {
                q.userAnswer = e.target.value;
                q.answered = true;
                updateStatsUI();
                renderCurrentQuestion();
            }
        }));
    }
    confirmMultiBtn.style.display = (q.type === "multi" && !q.answered) ? "inline-flex" : "none";
    
    if(!q.answered && q.type === "multi" && Array.isArray(selected)) {
        let boxes = document.querySelectorAll('#optionsContainer input[type="checkbox"]');
        boxes.forEach(cb => {
            if(selected.includes(cb.value)) cb.checked = true;
            cb.addEventListener('change', () => {
                questions[currentIndex].userAnswer = Array.from(document.querySelectorAll('#optionsContainer input:checked')).map(c => c.value);
            });
        });
    }
}
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function renderNav(){ navGridDiv.innerHTML=''; for(let i=0;i<questions.length;i++){ let btn=document.createElement('div'); btn.classList.add('nav-btn'); if(questions[i].answered) btn.classList.add('answered'); if(i===currentIndex) btn.classList.add('current'); btn.innerText=i+1; btn.addEventListener('click',((idx)=>()=>{ currentIndex=idx; renderCurrentQuestion(); renderNav(); })(i)); navGridDiv.appendChild(btn); } }
    function updateTimerDisplay(){ if(submitted) return; let e=Math.floor((Date.now()-startTime)/1000),h=Math.floor(e/3600),m=Math.floor((e%3600)/60),s=e%60; timerSpan.innerText=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function startTimer(){ if(timerInterval) clearInterval(timerInterval); timerInterval=setInterval(updateTimerDisplay,1000); }
    function submitExam(){ if(submitted) return; submitted=true; clearInterval(timerInterval); let sc=computeScore(); finalScoreDisplay.innerText=sc+" / "+questions.length; scoreDetailDiv.innerHTML=`✅ 最终得分率 ${Math.round(sc/questions.length*100)}% ，答对 ${sc} 题。`; realScoreSpan.innerText=sc; }
    function resetAll(){ if(confirm("重置所有进度？")){ questions.forEach(q=>{ q.userAnswer=null; q.answered=false; }); currentIndex=0; startTime=Date.now(); submitted=false; clearInterval(timerInterval); startTimer(); renderCurrentQuestion(); updateStatsUI(); finalScoreDisplay.innerText="—"; scoreDetailDiv.innerHTML=""; renderNav(); } }
    document.getElementById("prevBtn").addEventListener("click",()=>{ if(currentIndex>0){ currentIndex--; renderCurrentQuestion(); renderNav(); } });
    document.getElementById("nextBtn").addEventListener("click",()=>{ if(currentIndex<questions.length-1){ currentIndex++; renderCurrentQuestion(); renderNav(); } });
    document.getElementById("submitBtn").addEventListener("click",submitExam);
    document.getElementById("resetAllBtn").addEventListener("click",resetAll);
    confirmMultiBtn.addEventListener("click",confirmMultiAnswer);
    startTimer(); renderCurrentQuestion(); updateStatsUI(); renderNav();
</script>
</body>
</html>
