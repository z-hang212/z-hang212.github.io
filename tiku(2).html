<script>
    const CHAPTERS = [
        { id: 0, name: "第1章 国产CPU", desc: "龙芯/飞腾/鲲鹏/海光/兆芯" },

        { id: 5, name: "第6章 兼容性验证", desc: "功能/数据/平台兼容" },

    ];

    let allQuestions = [];
    let currentChapter = 0;
    let currentIndexInChapter = 0;
    let startTime = Date.now(), timerInterval = null, submitted = false;

    function addSingle(ch, text, opts, correct, exp, detailedAnalysis) { 
        allQuestions.push({ chapter:ch, id:allQuestions.length+1, text, options:opts, correct, explanation:exp, detailedAnalysis:detailedAnalysis, type:"single", userAnswer:null, answered:false }); 
    }
    function addMulti(ch, text, opts, correctArr, exp, detailedAnalysis) { 
        allQuestions.push({ chapter:ch, id:allQuestions.length+1, text, options:opts, correct:correctArr, explanation:exp, detailedAnalysis:detailedAnalysis, type:"multi", userAnswer:null, answered:false }); 
    }
    function addJudge(ch, text, correctBool, exp, detailedAnalysis) { 
        let opts=["A. 正确","B. 错误"]; 
        let correct=correctBool?"A":"B"; 
        allQuestions.push({ chapter:ch, id:allQuestions.length+1, text, options:opts, correct, explanation:exp, detailedAnalysis:detailedAnalysis, type:"judge", userAnswer:null, answered:false }); 
    }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    // ===================== 第1章 国产CPU（优化解析版）=====================
    addSingle(0, "在信创适配迁移中，将Java应用从x86迁移到飞腾(ARM)环境，最可能遇到的编译问题是？", 
        ["A. JDK版本不兼容", "B. 依赖的本地库(.so)需重新编译", "C. 数据库驱动缺失", "D. 前端页面无法显示"], 
        "B", 
        "本地动态库必须基于ARM架构重新编译，否则无法链接。",
        "🔍 选项详细分析：<br><strong>A ❌ JDK版本不兼容</strong>：Java是跨平台语言，主流JDK（如OpenJDK）同时支持x86和ARM架构，只要选择对应版本即可，这不是迁移中的主要编译问题。<br><strong>B ✅ 依赖的本地库(.so)需重新编译</strong>：Java通过JNI调用C/C++编译的本地动态库（.so文件）。这些.so文件包含与CPU架构绑定的机器码，x86编译的.so无法在ARM上运行，必须获取源码重新编译为ARM版本，这是最典型的编译问题。<br><strong>C ❌ 数据库驱动缺失</strong>：数据库驱动通常是纯Java的JAR包，跨平台兼容，不存在架构迁移问题。<br><strong>D ❌ 前端页面无法显示</strong>：前端页面（HTML/CSS/JS）与后端CPU架构无关，在任何平台上浏览器解析效果相同。"
    );
    
    addSingle(0, "以下基于ARM架构的国产CPU是？", 
        ["A. 海光C86", "B. 兆芯KX", "C. 飞腾S2500", "D. 龙芯3A5000"], 
        "C", 
        "飞腾基于ARMv8，海光/兆芯x86，龙芯LoongArch。",
        "🔍 选项详细分析：<br><strong>A ❌ 海光C86</strong>：海光处理器获得AMD Zen架构授权，兼容x86-64指令集，属于x86阵营。<br><strong>B ❌ 兆芯KX</strong>：兆芯与威盛合作获得x86授权，兼容x86指令集，属于x86阵营。<br><strong>C ✅ 飞腾S2500</strong>：飞腾获得ARMv8架构永久授权，S2500是其64核服务器处理器，属于ARM架构。<br><strong>D ❌ 龙芯3A5000</strong>：龙芯早期使用MIPS授权，3A5000开始使用完全自主研发的LoongArch指令集，不属于ARM架构。"
    );
    
    addSingle(0, "海光处理器指令集属于？", 
        ["A. ARM", "B. x86", "C. RISC-V", "D. MIPS"], 
        "B", 
        "海光兼容x86生态。",
        "🔍 选项详细分析：<br><strong>A ❌ ARM</strong>：ARM是英国ARM公司的RISC架构，主要用于移动设备和嵌入式，海光不属于此架构。<br><strong>B ✅ x86</strong>：海光与AMD合作获得Zen架构授权，完全兼容x86-64指令集，可运行Windows和Linux的x86版本。<br><strong>C ❌ RISC-V</strong>：RISC-V是新兴开源RISC架构，目前国产厂商如阿里平头哥、赛昉科技在推广，海光不采用。<br><strong>D ❌ MIPS</strong>：MIPS是早期RISC架构，龙芯早期使用过，海光不使用MIPS指令集。"
    );
    
    addSingle(0, "飞腾服务器编译C++适配选项？", 
        ["A. -march=armv8", "B. -march=x86_64", "C. -target intel", "D. -m64"], 
        "A", 
        "飞腾ARMv8使用-march=armv8优化。",
        "🔍 选项详细分析：<br><strong>A ✅ -march=armv8</strong>：GCC编译器使用-march参数指定目标CPU架构，飞腾基于ARMv8，该参数使编译器生成ARMv8优化的机器码。<br><strong>B ❌ -march=x86_64</strong>：这是x86_64架构的编译参数，生成的代码无法在飞腾ARM处理器上运行。<br><strong>C ❌ -target intel</strong>：这不是GCC标准参数，-target通常用于LLVM/Clang指定目标平台，intel指向x86架构。<br><strong>D ❌ -m64</strong>：-m64表示生成64位代码，但不指定具体指令集架构，默认按编译器默认架构生成，在ARM上不加-march可能生成兼容性较差的代码。"
    );
    
    addSingle(0, "龙芯3A5000使用指令集？", 
        ["A. MIPS", "B. LoongArch", "C. ARM", "D. x86"], 
        "B", 
        "龙芯自主LoongArch指令集。",
        "🔍 选项详细分析：<br><strong>A ❌ MIPS</strong>：龙芯早期产品（如2F、3A1000）使用MIPS指令集，但3A5000已全面转向自主LoongArch。<br><strong>B ✅ LoongArch</strong>：龙芯中科于2020年发布的完全自主指令集架构，龙芯3A5000是首款采用LoongArch的桌面处理器。<br><strong>C ❌ ARM</strong>：ARM是英国公司架构，飞腾使用，龙芯不使用ARM。<br><strong>D ❌ x86</strong>：x86是Intel/AMD主导的复杂指令集架构，国产兆芯、海光使用，龙芯不使用。"
    );
    
    addSingle(0, "龙芯处理器主要采用的指令集架构是？", 
        ["A. x86", "B. ARM", "C. MIPS / LoongArch", "D. RISC-V"], 
        "C", 
        "龙芯早期使用MIPS授权，3A5000开始全面转向自主指令集LoongArch。",
        "🔍 选项详细分析：<br><strong>A ❌ x86</strong>：x86是Intel/AMD的复杂指令集，龙芯从未采用。<br><strong>B ❌ ARM</strong>：ARM是英国ARM公司的RISC架构，飞腾采用，龙芯不采用。<br><strong>C ✅ MIPS / LoongArch</strong>：龙芯发展分两个阶段：早期获得MIPS授权（3A1000、3A2000、3A3000系列）；2020年后发布完全自主的LoongArch指令集（3A5000、3C5000系列）。<br><strong>D ❌ RISC-V</strong>：RISC-V是新兴开源RISC架构，目前国内有多家厂商跟进，但龙芯尚未采用。"
    );
    
    addSingle(0, "飞腾处理器属于哪种架构体系？", 
        ["A. x86", "B. MIPS", "C. ARM", "D. PowerPC"], 
        "C", 
        "飞腾基于ARM v8指令集永久授权。",
        "🔍 选项详细分析：<br><strong>A ❌ x86</strong>：x86是Intel/AMD的复杂指令集，海光、兆芯采用此架构。<br><strong>B ❌ MIPS</strong>：MIPS是斯坦福大学开发的RISC架构，龙芯早期使用。<br><strong>C ✅ ARM</strong>：飞腾获得ARM v8架构的永久授权，包括FT、腾锐、腾云全系列。<br><strong>D ❌ PowerPC</strong>：PowerPC是IBM开发的RISC架构，曾是苹果Mac、游戏主机使用，国产申威处理器早期基于此架构发展而来。"
    );
    
    addSingle(0, "以下哪个国产CPU厂商的处理器主要面向服务器和桌面市场？", 
        ["A. 兆芯", "B. 申威", "C. 飞腾", "D. 华为鲲鹏"], 
        "C", 
        "飞腾拥有服务器CPU S2500和桌面CPU D2000，产品线完整。",
        "🔍 选项详细分析：<br><strong>A ❌ 兆芯</strong>：兆芯主打桌面CPU，服务器产品较少且市场占有率低。<br><strong>B ❌ 申威</strong>：申威主要面向超算（神威·太湖之光）和特种计算领域，桌面和通用服务器市场较少。<br><strong>C ✅ 飞腾</strong>：飞腾产品线完整——桌面有FT-2000/4、腾锐D2000，服务器有FT-1500A/16、腾云S2500，覆盖桌面和服务器双市场。<br><strong>D ❌ 华为鲲鹏</strong>：鲲鹏主打服务器和数据中心（鲲鹏920），桌面产品较少（鲲鹏916主要在特定整机中出现）。"
    );
    
    addSingle(0, "龙芯3A5000采用的是哪一代自主指令集？", 
        ["A. MIPS64", "B. LoongArch", "C. ARMv8", "D. x86-64"], 
        "B", 
        "LoongArch是龙芯中科2020年发布的完全自主指令集架构。",
        "🔍 选项详细分析：<br><strong>A ❌ MIPS64</strong>：龙芯3A1000/3A2000/3A3000使用的架构，但3A5000已弃用。<br><strong>B ✅ LoongArch</strong>：龙芯2020年发布的完全自主指令集，龙芯3A5000是首款采用该架构的桌面处理器。<br><strong>C ❌ ARMv8</strong>：ARMv8是ARM公司64位架构，飞腾、鲲鹏采用，龙芯不采用。<br><strong>D ❌ x86-64</strong>：x86-64是AMD/Intel的64位复杂指令集架构，海光、兆芯采用，龙芯不采用。"
    );
    
    addSingle(0, "国产CPU在迁移适配中，最核心关注的技术点是？", 
        ["A. 品牌知名度", "B. 指令集架构兼容性", "C. 市场占有率", "D. 价格优势"], 
        "B", 
        "不同指令集导致二进制不兼容，是迁移核心问题。",
        "🔍 选项详细分析：<br><strong>A ❌ 品牌知名度</strong>：品牌知名度与技术支持没有直接技术关联。<br><strong>B ✅ 指令集架构兼容性</strong>：不同指令集（x86/ARM/LoongArch/MIPS）的机器码互不兼容，已编译的二进制程序需要重新编译或适配，这是技术迁移最核心的挑战。<br><strong>C ❌ 市场占有率</strong>：市场占有率是商业因素，不直接影响技术迁移工作。<br><strong>D ❌ 价格优势</strong>：价格是采购决策因素，与技术迁移无关。"
    );
    
    addSingle(0, "龙芯处理器的LoongArch指令集是基于以下哪种架构自主演进而来？", 
        ["A. x86", "B. ARM", "C. MIPS", "D. RISC-V"],

    addSingle(2, "海量数据库支持的操作系统不包括？", ["A. 麒麟", "B. 统信", "C. Windows XP", "D. CentOS"], "C", "海量数据库支持主流Linux和Windows Server，XP已停止维护不支持。", null);
    addSingle(2, "用于数据库性能分析的工具AWR通常指？", ["A. 自动工作负载仓库", "B. 自动写入日志", "C. 高级Web报表", "D. 应用接口"], "A", "AWR（Automatic Workload Repository）是Oracle性能分析工具。", null);
    addSingle(2, "在迁移Oracle到国产库时，VARCHAR2类型通常映射为？", ["A. VARCHAR", "B. TEXT", "C. CLOB", "D. BLOB"], "A", "Oracle VARCHAR2在PostgreSQL/达梦/金仓中映射为VARCHAR。", null);
    addSingle(2, "海量数据库的日志文件通常存放在？", ["A. /var/log/vastbase", "B. /data/log", "C. pg_log", "D. /tmp"], "C", "PostgreSQL/海量数据库日志默认在pg_log目录。", null);
    addSingle(2, "数据库索引的主要作用是？", ["A. 提高查询速度", "B. 减少存储空间", "C. 增加数据冗余", "D. 美化数据"], "A", "索引类似书目录，快速定位数据，提升查询性能。", null);
    addSingle(2, "海量数据库默认的监听端口是多少？", ["A. 5432", "B. 3306", "C. 1521", "D. 1433"], "A", "海量数据库基于PostgreSQL，默认端口5432。", null);
    addSingle(2, "在海量数据库中，创建数据库的SQL命令是？", ["A. CREATE DATABASE", "B. CREATE DB", "C. NEW DATABASE", "D. ADD DATABASE"], "A", "CREATE DATABASE 数据库名是SQL标准建库命令。", null);
    addSingle(2, "海量数据库支持哪种标准SQL语言版本？", ["A. SQL-92", "B. SQL:1999", "C. SQL:2003", "D. SQL:2016"], "D", "海量数据库兼容SQL:2016标准。", null);
    addSingle(2, "如何查看海量数据库当前所有数据库列表？", ["A. SHOW DATABASES;", "B. LIST DATABASES;", "C. SELECT * FROM pg_database;", "D. \\l"], "D", "psql元命令\\l查看数据库列表，或查询pg_database系统表。", null);
    addSingle(2, "在海量数据库中，删除表中的所有数据但保留表结构的命令是？", ["A. DELETE FROM table;", "B. TRUNCATE TABLE table;", "C. DROP TABLE table;", "D. REMOVE FROM table;"], "B", "TRUNCATE快速清空表数据，保留结构，不可回滚，比DELETE高效。", null);
    addSingle(2, "海量数据库的默认管理员用户名是？", ["A. root", "B. admin", "C. postgres", "D. sysdba"], "C", "海量/PostgreSQL默认超级管理员为postgres。", null);
    addSingle(2, "如何在海量数据库中创建一个普通用户并授予登录权限？", ["A. CREATE USER", "B. ADD USER", "C. CREATE LOGIN", "D. NEW USER"], "A", "CREATE USER 用户名 WITH LOGIN PASSWORD '密码'创建可登录用户。", null);
    addSingle(2, "海量数据库支持哪种分区表类型？", ["A. 范围分区", "B. 列表分区", "C. 哈希分区", "D. 以上都是"], "D", "海量支持范围、列表、哈希三种分区方式。", null);
    addSingle(2, "在海量数据库中，用于导入SQL文件的命令行工具是？", ["A. psql -f", "B. mysql < file.sql", "C. sqlplus @file.sql", "D. isql -i"], "A", "psql -d 数据库名 -f 脚本.sql执行SQL文件。", null);
    addSingle(2, "海量数据库的配置文件通常名称是什么？", ["A. postgresql.conf", "B. my.cnf", "C. init.ora", "D. hldb.conf"], "A", "postgresql.conf是海量/PostgreSQL主配置文件。", null);
    addSingle(2, "如何在海量数据库中查看当前所有活动连接？", ["A. SELECT * FROM pg_stat_activity;", "B. SHOW PROCESSLIST;", "C. SHOW CONNECTIONS;", "D. LIST ACTIVE CONNECTIONS;"], "A", "pg_stat_activity系统视图显示每个连接的详细信息。", null);
    addSingle(2, "海量数据库的备份命令是？", ["A. pg_dump", "B. mysqldump", "C. expdp", "D. sqlbackup"], "A", "pg_dump是逻辑备份工具，pg_dumpall备份所有数据库。", null);
    addSingle(2, "在海量数据库中，创建唯一索引的SQL语句是？", ["A. CREATE UNIQUE INDEX", "B. CREATE DISTINCT INDEX", "C. CREATE SINGLE INDEX", "D. CREATE UNIQ INDEX"], "A", "CREATE UNIQUE INDEX 索引名 ON 表名(列名)创建唯一索引。", null);
    addSingle(2, "海量数据库支持哪种数据类型存储JSON？", ["A. JSON", "B. JSONB", "C. TEXT可以存储JSON", "D. 以上都是"], "D", "海量支持JSON和JSONB类型，TEXT也可存JSON但无校验和优化。", null);
    addSingle(2, "如何修改海量数据库用户的密码？", ["A. ALTER USER ... PASSWORD", "B. SET PASSWORD FOR ...", "C. CHANGE USER PASSWORD", "D. UPDATE user SET password="], "A", "ALTER USER 用户名 WITH PASSWORD '新密码';修改用户密码。", null);
    addSingle(2, "海量数据库的事务隔离级别默认是？", ["A. READ UNCOMMITTED", "B. READ COMMITTED", "C. REPEATABLE READ", "D. SERIALIZABLE"], "B", "PostgreSQL/海量默认Read Committed，避免脏读。", null);
    addSingle(2, "在海量数据库中，查看表结构的命令是？", ["A. \\d table", "B. DESCRIBE table;", "C. SHOW COLUMNS FROM table;", "D. DESC table;"], "A", "psql中\\d 表名显示表结构、索引、约束等。", null);
    addSingle(2, "海量数据库支持哪种主从复制方式？", ["A. 异步复制", "B. 同步复制", "C. 半同步复制", "D. 以上都是"], "D", "海量支持异步、同步、半同步多种复制模式。", null);
    addSingle(2, "如何在海量数据库中开启查询执行计划分析？", ["A. EXPLAIN", "B. ANALYZE", "C. PROFILE", "D. TRACE"], "A", "EXPLAIN显示SQL执行计划，EXPLAIN ANALYZE实际执行并计时。", null);
    addSingle(2, "海量数据库的日志文件通常存放在哪个目录？", ["A. /var/log/postgresql", "B. $PGDATA/pg_log", "C. /var/lib/pgsql/log", "D. 可配置"], "D", "通过log_directory参数配置日志目录，默认在PGDATA/pg_log。", null);
    addSingle(2, "在海量数据库中，回收用户所有权限的语句是？", ["A. REVOKE ALL PRIVILEGES", "B. REMOVE ALL PRIVILEGES", "C. DROP USER PRIVILEGES", "D. CLEAR ALL PERMISSIONS"], "A", "REVOKE ALL PRIVILEGES ON DATABASE db FROM user;回收权限。", null);
    addSingle(2, "海量数据库的存储过程支持哪种语言？", ["A. PL/pgSQL", "B. SQL", "C. C", "D. 以上都是"], "D", "海量支持PL/pgSQL、纯SQL、C语言扩展等多种存储过程语言。", null);
    addSingle(2, "如何查看海量数据库版本信息？", ["A. SELECT version();", "B. SHOW VERSION;", "C. SELECT @@version;", "D. VERSION();"], "A", "SELECT version();返回数据库版本和编译信息。", null);
    addSingle(2, "海量数据库的最大连接数参数是什么？", ["A. max_connections", "B. maxconn", "C. max_user_connections", "D. connections"], "A", "postgresql.conf中max_connections参数控制最大连接数。", null);
    addSingle(2, "在海量数据库中，创建视图的SQL语句是？", ["A. CREATE VIEW", "B. CREATE VIRTUAL TABLE", "C. MAKE VIEW", "D. NEW VIEW"], "A", "CREATE VIEW 视图名 AS SELECT ...创建虚拟表。", null);
    addSingle(2, "海量数据库支持全文检索吗？如果支持，采用什么方式？", ["A. 不支持", "B. 支持，使用GIN索引", "C. 支持，使用B-tree索引", "D. 支持，使用Hash索引"], "B", "海量支持全文检索，使用GIN索引加速tsvector类型查询。", null);
    addSingle(2, "如何在海量数据库中设置自动提交为关闭？", ["A. SET AUTOCOMMIT OFF;", "B. \\set AUTOCOMMIT off", "C. SET autocommit = 0;", "D. \\set autocommit = off"], "B", "psql中使用\\set AUTOCOMMIT off关闭自动提交，需手动COMMIT。", null);
    addSingle(2, "海量数据库的临时表空间默认名称是？", ["A. temp", "B. pg_temp", "C. tmp", "D. temporary"], "B", "pg_temp是会话级临时表空间，会话结束后自动清理。", null);
    addSingle(2, "在海量数据库中，导出数据为CSV格式的命令是？", ["A. COPY ... TO ... CSV", "B. EXPORT ... CSV", "C. SELECT ... INTO OUTFILE", "D. 使用pg_dump指定格式"], "A", "COPY 表名 TO '文件.csv' CSV HEADER;导出为CSV格式。", null);
    addSingle(2, "海量数据库的并发控制主要采用哪种锁机制？", ["A. MVCC", "B. 表锁", "C. 行锁", "D. 页锁"], "A", "海量采用MVCC多版本并发控制，读写不互锁，提高并发性能。", null);
    addSingle(2, "海量数据库支持的索引类型包括？", ["A. B-tree", "B. Hash", "C. GIN", "D. 以上都是"], "D", "PostgreSQL/海量支持B-tree、Hash、GIN、GiST、SP-GiST、BRIN等索引。", null);
    addSingle(2, "海量数据库的高可用方案有？", ["A. 主从复制", "B. 双机热备", "C. 集群", "D. 以上都是"], "D", "高可用方案：主从异步/同步、双机热备、Patroni集群、分布式分片。", null);
    addSingle(2, "海量数据库的安全特性包括？", ["A. 用户认证", "B. 权限管理", "C. 数据加密", "D. 以上都是"], "D", "安全体系：SCRAM认证、RBAC权限、TDE加密、审计日志。", null);
    addSingle(2, "海量数据库中，查看性能的视图有？", ["A. pg_stat_database", "B. pg_stat_user_tables", "C. pg_stat_activity", "D. 以上都是"], "D", "性能视图：数据库统计、表统计、活动连接、复制状态。", null);

    addSingle(3, "中创中间件中配置数据源时，需要设置的参数有？", ["A. JDBC URL", "B. 驱动类名", "C. 用户名与密码", "D. 最大/最小连接数"], "D", "数据源配置必需：JDBC URL、驱动类名、用户名密码，可选连接数。", null);

    addSingle(6, "性能调优中，开启G1垃圾回收器的JVM参数是？", ["A. -XX:+UseG1GC", "B. -XX:+UseParallelGC", "C. -XX:+UseConcMarkSweepGC", "D. -XX:+UseSerialGC"], "A", "-XX:+UseG1GC启用G1垃圾回收器，适合大堆内存应用。", null);

    addSingle(7, "报错“cannot find libxxx.so”的含义是？", ["A. CPU过热", "B. 缺少动态链接库或架构不匹配", "C. 数据库拒绝连接", "D. 磁盘空间已满"], "B", "动态库缺失或ARM/x86不匹配导致该链接错误。", null);
    addSingle(7, "麒麟V10中查看网络连接命令？", ["A. ss", "B. netstat", "C. lsof -i", "D. 以上都是"], "D", "ss、netstat、lsof均可查看网络连接。", null);
    addSingle(7, "若迁移后程序崩溃，日志中出现'Segmentation fault'，最可能是？", ["A. 内存越界或调用不兼容动态库", "B. 网络延迟", "C. 用户误操作", "D. 数据库锁表"], "A", "段错误通常是程序访问了非法内存地址。", null);
    addSingle(7, "故障排查中，首先应查看的是？", ["A. 应用与中间件日志", "B. 系统桌面", "C. 用户反馈邮件", "D. 服务器硬件外观"], "A", "日志是故障定位的第一手资料。", null);
    addSingle(7, "应用启动失败，日志提示'端口被占用'，优先排查？", ["A. netstat查看端口占用情况", "B. 重启服务器", "C. 更换显示器", "D. 重新安装操作系统"], "A", "使用netstat -tlnp查看端口占用进程。", null);

    addSingle(7, "应用迁移完成后，性能验证的核心指标不包括？", ["A. 页面响应时间", "B. 并发处理能力（TPS）", "C. 系统资源使用率（CPU/内存）", "D. 应用图标美观度"], "D", "图标美观度属于UI体验，非性能指标。", null);

    addSingle(7, "在信创环境下，应用启动失败首先应检查什么？", ["A. 网络连接", "B. 日志文件", "C. 硬件状态", "D. 数据库连接"], "B", "日志记录错误堆栈，是定位启动失败的第一信息源。", null);
    addSingle(7, "如何检查操作系统是否识别了所有硬件设备？", ["A. lspci", "B. lsusb", "C. dmesg", "D. 以上都是"], "D", "lspci查看PCI设备，lsusb查看USB设备，dmesg查看内核识别日志。", null);
    addSingle(7, "应用日志中频繁出现'Connection refused'表示什么？", ["A. 数据库密码错误", "B. 目标服务未启动或端口不可达", "C. 网络不通", "D. 防火墙屏蔽"], "B", "连接被拒绝表示端口监听不存在或连接被拒绝。", null);
    addSingle(7, "故障排查中，复现问题的首要前提是什么？", ["A. 了解业务逻辑", "B. 获取完整日志", "C. 搭建相同环境", "D. 明确触发条件"], "D", "明确触发条件是稳定复现问题的关键。", null);

    addSingle(7, "'故障排查'中常用的Linux命令不包括？", ["A. tail -f logs/app.log", "B. netstat -anp | grep 端口", "C. ps aux | grep java", "D. ping baidu.com"], "D", "ping测试网络连通性，属于网络层排查。", null);
    addSingle(7, "应用启动失败，可能的原因不包括？", ["A. 端口被占用", "B. 依赖库缺失", "C. 用户名密码错误", "D. 系统主题设置为深色模式"], "D", "系统主题属于桌面美化，完全不影响应用启动逻辑。", null);

    addSingle(7, "应用日志分析时可以关注的关键字有？", ["A. Exception", "B. Error", "C. Timeout", "D. 以上都是"], "D", "重点关注：Exception异常、Error错误、Timeout超时、拒绝连接。", null);

    addMulti(9, "麒麟操作系统的安全特性包括？", ["A. 内置安全审计机制", "B. 支持国密算法", "C. 提供防火墙工具", "D. 仅支持命令行操作，降低攻击面"], ["A","B","C"], "麒麟安全特性：审计、国密、防火墙。", null);
    
    // ===================== 交互逻辑 =====================
    function getCurrentChapterQuestions() { return allQuestions.filter(q => q.chapter === currentChapter); }

    let currentChapterQuestions = getCurrentChapterQuestions();
    
    const totalSpan = document.getElementById("totalCount");
    const answeredSpan = document.getElementById("answeredCount");
    const timerSpan = document.getElementById("timer");
    const realScoreSpan = document.getElementById("realScore");
    const maxScoreSpan = document.getElementById("maxScoreSpan");
    const finalScoreDisplay = document.getElementById("finalScoreDisplay");
    const scoreDetailDiv = document.getElementById("scoreDetail");
    const navGridDiv = document.getElementById("navGrid");
    const currentQWrapper = document.getElementById("currentQWrapper");
    const confirmMultiBtn = document.getElementById("confirmMultiBtn");
    const currentChapterSpan = document.getElementById("currentChapter");
    const chapterTotalSpan = document.getElementById("chapterTotal");

    function updateChapterInfo() {
        currentChapterQuestions = getCurrentChapterQuestions();
        currentChapterSpan.innerText = CHAPTERS[currentChapter].name;
        chapterTotalSpan.innerText = currentChapterQuestions.length;
        maxScoreSpan.innerText = currentChapterQuestions.length;
        if(currentIndexInChapter >= currentChapterQuestions.length) currentIndexInChapter = 0;
        renderNav();
        renderCurrentQuestion();
        updateStatsUI();
    }

    function computeScore() { 
        let s = 0; 
        for(let q of allQuestions) { 
            if(!q.answered) continue; 
            if(q.type==="single"||q.type==="judge") { 
                if(q.userAnswer===q.correct) s++; 
            } else if(Array.isArray(q.userAnswer)&&Array.isArray(q.correct)&&q.userAnswer.length===q.correct.length&&q.correct.every(c=>q.userAnswer.includes(c))) s++; 
        } 
        return s; 
    }
    
    function updateStatsUI() { 
        let ac = allQuestions.filter(q=>q.answered).length; 
        answeredSpan.innerText = ac; 
        let sc = computeScore(); 
        realScoreSpan.innerText = sc; 
        if(submitted) finalScoreDisplay.innerText = sc + " / " + allQuestions.length; 
        renderNav(); 
    }
    
    function confirmMultiAnswer() { 
        let q = currentChapterQuestions[currentIndexInChapter]; 
        if(!q || q.type!=="multi" || q.answered) return; 
        let checked = Array.from(document.querySelectorAll('#optionsContainer input:checked')).map(cb=>cb.value); 
        if(checked.length===0){ alert("请至少选择一个选项"); return; } 
        q.userAnswer = checked; 
        q.answered = true; 
        updateStatsUI(); 
        renderCurrentQuestion(); 
    }
    
    function renderCurrentQuestion() { 
        let q = currentChapterQuestions[currentIndexInChapter]; 
        if(!q) return; 
        let selected = q.userAnswer, isMulti = q.type==="multi"; 
        let html = `<div class="q-card"><div class="q-title">题目 ${currentIndexInChapter+1}/${currentChapterQuestions.length} | 全局第${q.id}题 <span class="chapter-info">${CHAPTERS[q.chapter].name}</span></div><div class="q-text">${escapeHtml(q.text)}</div><div class="options" id="optionsContainer">`;
        for(let opt of q.options){ 
            let letter = opt.charAt(0), optText = opt.substring(2); 
            let isCorrect = (q.type!=="multi")?(letter===q.correct):q.correct.includes(letter); 
            let isUser = (q.type!=="multi")?(selected===letter):(Array.isArray(selected)&&selected.includes(letter)); 
            let addClass = "", disabled = "", checked = "";
            if(q.answered){ 
                disabled = "disabled"; 
                if(isCorrect) addClass = "correct-answer-display"; 
                if(isUser && !isCorrect) addClass = "wrong-highlight"; 
                if(isUser && isCorrect) addClass = "correct-highlight"; 
                checked = isUser ? "checked" : ""; 
            } else { 
                checked = isUser ? "checked" : ""; 
            }
            html += `<div class="option ${addClass}"><input type="${isMulti?'checkbox':'radio'}" name="question" value="${letter}" id="opt_${letter}" ${checked} ${disabled}><label for="opt_${letter}"><strong>${letter}</strong>. ${escapeHtml(optText)}</label></div>`;
        } 
        html += `</div>`;
        if(q.answered){ 
            let isCurrCorrect = (q.type!=="multi")?(q.userAnswer===q.correct):(Array.isArray(q.userAnswer)&&Array.isArray(q.correct)&&q.userAnswer.length===q.correct.length&&q.correct.every(c=>q.userAnswer.includes(c))); 
            let statusText = isCurrCorrect?"✓正确":"✗错误"; 
            let statusClass = isCurrCorrect?"feedback-correct":"feedback-wrong"; 
            let correctStr = (q.type==="multi")?q.correct.join("、"):q.correct; 
            html += `<div class="feedback-area"><div class="${statusClass}">${statusText}</div><div><strong>📖答案：</strong> ${escapeHtml(correctStr)}</div><div><strong>💡解析：</strong> ${escapeHtml(q.explanation)}</div>`;
            if(q.detailedAnalysis){
                html += `<div class="detailed-explanation">${q.detailedAnalysis}</div>`;
            }
            html += `</div>`;
        } else { 
            html += `<div class="feedback-area feedback-neutral">${isMulti?"✅ 勾选所有正确选项后点击「确认答案」":"⚡ 点击选项立即判题"}</div>`;
            if(q.detailedAnalysis && !q.answered){
                html += `<div class="detailed-explanation" style="margin-top:8px;padding-top:8px;border-top:1px dashed #cfe3c2;"><details><summary style="cursor:pointer;color:#2c6e3c;font-size:0.75rem;">🔍 查看选项详细解析</summary><div style="margin-top:8px;">${q.detailedAnalysis}</div></details></div>`;
            }
        } 
        html += `</div>`;
        currentQWrapper.innerHTML = html;
        
        if(q.type!=="multi" && !q.answered){ 
            document.querySelectorAll('input[name="question"]').forEach(radio=>radio.addEventListener('change',(e)=>{ 
                if(e.target.checked){ 
                    q.userAnswer = e.target.value; 
                    q.answered = true; 
                    updateStatsUI(); 
                    renderCurrentQuestion(); 
                } 
            })); 
        }
        confirmMultiBtn.style.display = (q.type==="multi" && !q.answered) ? "inline-flex" : "none";
        
        if(!q.answered && q.type==="multi" && Array.isArray(selected)){ 
            let boxes = document.querySelectorAll('#optionsContainer input[type="checkbox"]'); 
            boxes.forEach(cb=>{ 
                if(selected.includes(cb.value)) cb.checked = true; 
                cb.addEventListener('change',()=>{ 
                    currentChapterQuestions[currentIndexInChapter].userAnswer = Array.from(document.querySelectorAll('#optionsContainer input:checked')).map(c=>c.value); 
                }); 
            }); 
        }
    }
    
    function renderNav(){ 
        navGridDiv.innerHTML = ''; 
        for(let i=0; i<currentChapterQuestions.length; i++){ 
            let btn = document.createElement('div'); 
            btn.classList.add('nav-btn'); 
            if(currentChapterQuestions[i].answered) btn.classList.add('answered'); 
            if(i === currentIndexInChapter) btn.classList.add('current'); 
            btn.innerText = i+1; 
            btn.addEventListener('click', ((idx)=>()=>{ 
                currentIndexInChapter = idx; 
                renderCurrentQuestion(); 
                renderNav(); 
            })(i)); 
            navGridDiv.appendChild(btn); 
        } 
    }
    
    function updateTimerDisplay(){ 
        if(submitted) return; 
        let e = Math.floor((Date.now()-startTime)/1000), h = Math.floor(e/3600), m = Math.floor((e%3600)/60), s = e%60; 
        timerSpan.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; 
    }
    
    function startTimer(){ 
        if(timerInterval) clearInterval(timerInterval); 
        timerInterval = setInterval(updateTimerDisplay, 1000); 
    }
    
    function submitExam(){ 
        if(submitted) return; 
        submitted = true; 
        clearInterval(timerInterval); 
        let sc = computeScore(); 
        finalScoreDisplay.innerText = sc + " / " + allQuestions.length; 
        scoreDetailDiv.innerHTML = `✅ 最终得分率 ${Math.round(sc/allQuestions.length*100)}% ，答对 ${sc} 题。`; 
        realScoreSpan.innerText = sc; 
    }
    
    function resetAll(){ 
        if(confirm("重置所有进度？")){ 
            allQuestions.forEach(q=>{ q.userAnswer = null; q.answered = false; }); 
            currentIndexInChapter = 0; 
            startTime = Date.now(); 
            submitted = false; 
            clearInterval(timerInterval); 
            startTimer(); 
            renderCurrentQuestion(); 
            updateStatsUI(); 
            finalScoreDisplay.innerText = "—"; 
            scoreDetailDiv.innerHTML = ""; 
            renderNav(); 
        } 
    }
    
    function switchChapter(chapterId) {
        currentChapter = chapterId;
        currentIndexInChapter = 0;
        currentChapterQuestions = getCurrentChapterQuestions();
        updateChapterInfo();
        document.querySelectorAll('.chapter-tab').forEach((tab, idx) => {
            if(idx === chapterId) tab.classList.add('active');
            else tab.classList.remove('active');
        });
    }
    
    function renderChapterTabs() {
        const container = document.getElementById('chapterTabs');
        container.innerHTML = '';
        CHAPTERS.forEach((ch, idx) => {
            const tab = document.createElement('div');
            tab.className = 'chapter-tab' + (idx === currentChapter ? ' active' : '');
            tab.innerHTML = `${ch.name}<small style="display:block;font-size:0.65rem;">${ch.desc.substring(0,10)}</small>`;
            tab.addEventListener('click', () => switchChapter(idx));
            container.appendChild(tab);
        });
    }
    
    document.getElementById("prevBtn").addEventListener("click", () => { 
        if(currentIndexInChapter > 0){ 
            currentIndexInChapter--; 
            renderCurrentQuestion(); 
            renderNav(); 
        } 
    });
    document.getElementById("nextBtn").addEventListener("click", () => { 
        if(currentIndexInChapter < currentChapterQuestions.length - 1){ 
            currentIndexInChapter++; 
            renderCurrentQuestion(); 
            renderNav(); 
        } 
    });
    document.getElementById("submitBtn").addEventListener("click", submitExam);
    document.getElementById("resetAllBtn").addEventListener("click", resetAll);
    confirmMultiBtn.addEventListener("click", confirmMultiAnswer);
    
    renderChapterTabs();
    startTimer();
    updateChapterInfo();
    renderCurrentQuestion();
    updateStatsUI();
    renderNav();
    
    console.log("总题库数量:", allQuestions.length);
</script>
